hydra:
  run:
    dir: ./experiments/${scenario}/${dataset}_${initial_increment}-${increment}_without_exp
  job:
    chdir: true
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: ''
dataset_root: ''
workdir: ''
log_path: metric.json
model_name: ViT-B/16

dataset: imagenet_R
initial_increment: 10
increment: ${initial_increment}
scenario: class
batch_size: 64
train_batch_size: 64
epochs: 10
lr: 0.01
fp16: false
seed: 1993
num_workers: 8
beta: 0.5
mix_bias: 0.6
threshold: 0.55
shrinkage: false

dropout: 0.1
lambda_img: 0.5
lambda_txt: 2
replay_alpha: 0.25
sample_num: 0
stat: 0.8
sample_noise: 0.25
templates:
  - a painting of a {}.
  - a drawing of a {}.
  - a sketch of a {}.
  - a cartoon of a {}.
  - a graffiti of a {}.
  - a tattoo of a {}.
  - an illustration of a {}.
  - a digital art of a {}.
  - a 3D render of a {}.
  - a low poly render of a {}.
  - a pixel art of a {}.
  - a vector art of a {}.
  - a watercolor painting of a {}.
  - an oil painting of a {}.
  - a cubist painting of a {}.
  - a surreal painting of a {}.
  - a pop art of a {}.
  - a comic book drawing of a {}.
  - a children's book illustration of a {}.
  - a stylized art of a {}.
