hydra:
  run:
    dir: ./experiments/${scenario}/${dataset}_${initial_increment}-${increment}_without_exp
  job:
    chdir: true
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: ''
dataset_root: ''
workdir: ''
log_path: metric.json
model_name: ViT-B/16
prompt_template: a good photo of a {}.
dataset: imagenet_R
initial_increment: 10
increment: ${initial_increment}
scenario: class
batch_size: 64
train_batch_size: 64
epochs: 10
lr: 0.01
fp16: false
seed: 1993
num_workers: 8
beta: 0.5
mix_bias: 0.6
threshold: 0.55
shrinkage: false

dropout: 0.1
lambda_img: 0.5
lambda_txt: 2
replay_alpha: 0.25
sample_num: 0
stat: 0.8
sample_noise: 0.25
templates:
  - itap of a {}.
  - a bad photo of the {}.
  - a origami {}.
  - a photo of the large {}.
  - a {} in a video game.
  - art of the {}.
  - a photo of the small {}.
