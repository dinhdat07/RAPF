hydra:
  run:
    dir: ./experiments/${dataset}_${initial_increment}-${increment}_without_exp
  job:
    chdir: true

class_order: ''
dataset_root: ''
log_path: metric.json
model_name: ViT-B/16
prompt_template: a good photo of a {}.
dataset: imagenet_R
initial_increment: 10
increment: ${initial_increment}
batch_size: 64
train_batch_size: 64
epochs: 10
lr: 0.01
fp16: false
seed: 1993
num_workers: 8
beta: 0.5

threshold: 0.55
shrinkage: false

lambda_img: 0.5
lambda_txt: 2
sample_num: 0
stat: 0.9
sample_noise: 0.25
templates:
  - itap of a {}.
  - a bad photo of the {}.
  - a origami {}.
  - a photo of the large {}.
  - a {} in a video game.
  - art of the {}..
  - a photo of the small {}.
