hydra:
  run:
    dir: ./experiments/${scenario}/${dataset}_${initial_increment}-${increment}
  job:
    chdir: true

  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: ""
dataset_root: ""
workdir: ""
log_path: "metrics.json"
model_name: "ViT-B/16"
prompt_template: "a good photo of a {}."

batch_size: 128
initial_increment: 10  
increment: ${initial_increment}
scenario: "class"
dataset: "imagenet100"
num_workers: 16
train_batch_size: 128
epochs: 15
lr: 0.001
fp16: false
seed: 1993
milestones: [4,10]
beta: 1
mix_bias: 0.5
threshold: 0.65
shrinkage: False

engine:
  enable_otf: false
  otf_text: true
  otf_visual: true
  ptk: false
  alpha: 0.7
  topk: 5
  descriptor_json: "chat/imagenetr_des.json"
  text_template: "a photo of a {}, detailed"
  num_prompts_cap: 8
  lambda_img: 1.0
  lambda_txt: 2.0
  replay_alpha: 0.25
  sample_num: 0
  rerank: 0.5
  stat: 0.8
  sample_noise: 0.25
  templates:
  - itap of a {}.
  - a bad photo of the {}..
  - a origami {}.
  - a photo of the large {}.
  - a {} in a video game.
  - art of the {}.
  - a photo of the small {}.

