hydra:
  run:
    dir: ./experiments/${scenario}/${dataset}_${initial_increment}-${increment}_without_exp
  job:
    chdir: true

  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: ""
dataset_root: ""
workdir: ""
log_path: "metric.json"
model_name: "ViT-B/16"

batch_size: 64
initial_increment: 50  
increment: 10
scenario: "class"
dataset: "cifar100"
num_workers: 16
train_batch_size: 64
epochs: 10
lr: 0.01
fp16: false
seed: 1993
milestones: [4,10]
beta: 4 
mix_bias: 0.6
threshold: 0.55
shrinkage: false

dropout: 0.1
lambda_img: 2.0
lambda_txt: 2.0
replay_alpha: 0.25
stat: 0.8
sample_num: 0
sample_noise: 0.25

templates:
  - a photo of a {}.
  - a blurry photo of a {}.
  - a low resolution photo of a {}.
  - a cropped photo of a {}.
  - a close-up photo of a {}.
  - a bad photo of a {}.
  - a photo of the {}.
  - a blurry photo of the {}.
  - a low resolution photo of the {}.
  - a cropped photo of the {}.

