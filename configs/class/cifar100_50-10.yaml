hydra:
  run:
    dir: ./experiments/${scenario}/${dataset}_${initial_increment}-${increment}_without_exp
  job:
    chdir: true

  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: ""
dataset_root: ""
workdir: ""
log_path: "metric.json"
model_name: "ViT-B/16"
prompt_template: "a good photo of a {}."

batch_size: 64
initial_increment: 50  
increment: 10
scenario: "class"
dataset: "cifar100"
num_workers: 16
train_batch_size: 64
epochs: 15
lr: 0.01
fp16: false
seed: 2
milestones: [4,10]
beta: 4 
mix_bias: 0.6
threshold: 0.55
shrinkage: false
enable_engine_otf: null
enable_engine_ptk: null
engine_descriptor_json: "chat/cifar224_des.json"
engine_alpha: null

engine:
  enable_otf: false
  otf_text: true
  otf_visual: true
  ptk: false
  alpha: 0.7
  topk: 5
  descriptor_json: "chat/cifar224_des.json"
  text_template: "a photo of a {}, detailed"
  num_prompts_cap: 8
  lambda_img: 2.0
  lambda_txt: 2.0
  replay_alpha: 0.25
  sample_num: 0
  strong_aug:
    randaugment_n: 2
    randaugment_m: 9
    color_jitter: [0.4, 0.4, 0.4, 0.1]
    random_erasing_p: 0.25
  templates:
    - a photo of a {}.
    - a blurry photo of a {}.
    - a black and white photo of a {}.
    - a low contrast photo of a {}.
    - a high contrast photo of a {}.
    - a bad photo of a {}.
    - a good photo of a {}.
    - a photo of a small {}.
    - a photo of a big {}.
    - a photo of the {}.
    - a blurry photo of the {}.
    - a black and white photo of the {}.
    - a low contrast photo of the {}.
    - a high contrast photo of the {}.
    - a bad photo of the {}.
    - a good photo of the {}.
    - a photo of the small {}.
    - a photo of the big {}.
