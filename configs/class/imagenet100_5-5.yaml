hydra:
  run:
    dir: ./experiments/${scenario}/${dataset}_${initial_increment}-${increment}
  job:
    chdir: true

  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: ""
dataset_root: ""
workdir: ""
log_path: "metrics.json"
model_name: "ViT-B/16"
prompt_template: "a good photo of a {}."

batch_size: 64
initial_increment: 5  
increment: ${initial_increment}
scenario: "class"
dataset: "imagenet100"
# add conig
num_workers: 16
train_batch_size: 128
epochs: 15
lr: 0.001
fp16: false
seed: 2
milestones: [4,10]
beta: 1
mix_bias: 0.5
threshold: 0.65
shrinkage: False

fusion:
  enabled: true
  mode: svd
  topk_ratio: 0.05
  lambda_fuse: 0.2
  ties_window: 3
  micro_topk_ratio: 0.01
  micro_lambda: 0.1

exp_name: "${dataset}_${initial_increment}-${increment}"

offline_merge:
  enabled: false
  save_theta_each_task: true
  theta_dir: "checkpoints/offline_thetas/${exp_name}/"
  base_task: "first"
  merge_mode: "magmax"
  lambda_merge: 0.5
  gamma: 1.0
  eval_after_merge_only: true
